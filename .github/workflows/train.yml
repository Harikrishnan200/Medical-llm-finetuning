name: Validate and optionally queue Kaggle
on:
  push:
    paths:
      - 'src/**'
      - 'configs/**'
      - 'data/evaluation/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'kaggle/**'
      - '.github/workflows/train.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'configs/**'
      - 'data/evaluation/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'kaggle/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      queue_training:
        description: Queue a Kaggle GPU run after validation
        type: boolean
        default: false
      replace_existing_code:
        description: Replace legacy files in the existing private Kaggle code dataset
        type: boolean
        default: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src kaggle/launch.py
  queue:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.queue_training == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kaggle python-dotenv six
      - name: Stage code in private Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_REPLACE_EXISTING_CODE: ${{ inputs.replace_existing_code }}
        run: bash kaggle/stage_dataset.sh
      - name: Queue GPU notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python kaggle/launch.py
